name: CI concurrency proof

on:
  pull_request:
    branches: [ci/verify-concurrency-168]
  push:
    branches: [ci/verify-concurrency-168]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 90
      - run: echo "completed $GITHUB_SHA"
